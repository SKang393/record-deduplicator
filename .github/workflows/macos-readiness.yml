name: Encrypted macOS candidate check

on:
  push:
    branches: [SKang393/macos-readiness-20261104-1041e15a]

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'SKang393/record-deduplicator' && github.ref == 'refs/heads/SKang393/macos-readiness-20261104-1041e15a'
    runs-on: macos-15
    timeout-minutes: 150
    environment: dedup-macos-20261104-1041e15a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Decrypt and authenticate the candidate
        shell: bash
        env:
          MACOS_READINESS_KEY: ${{ secrets.MACOS_READINESS_KEY }}
        run: |
          set +x
          umask 077
          mkdir -p "$RUNNER_TEMP/dedup-private/evidence"
          touch "$RUNNER_TEMP/dedup-private/decrypt.log" "$RUNNER_TEMP/dedup-private/run.log"
          if ! node scripts/crypto.cjs decrypt payload/candidate.enc "$RUNNER_TEMP/dedup-private/source.zip" source >>"$RUNNER_TEMP/dedup-private/decrypt.log" 2>&1; then
            echo '::error::Candidate authentication failed. See encrypted evidence.'
            exit 1
          fi
          if ! node scripts/crypto.cjs decrypt payload/overlay.enc "$RUNNER_TEMP/dedup-private/overlay.zip" overlay >>"$RUNNER_TEMP/dedup-private/decrypt.log" 2>&1; then
            echo '::error::Test overlay authentication failed. See encrypted evidence.'
            exit 1
          fi
          if ! node scripts/crypto.cjs decrypt payload/validation.enc "$RUNNER_TEMP/dedup-private/validation.zip" validation >>"$RUNNER_TEMP/dedup-private/decrypt.log" 2>&1; then
            echo '::error::Synthetic evaluator overlay authentication failed. See encrypted evidence.'
            exit 1
          fi
          if ! node scripts/crypto.cjs decrypt payload/receipts.enc "$RUNNER_TEMP/dedup-private/receipts.zip" receipts >>"$RUNNER_TEMP/dedup-private/decrypt.log" 2>&1; then
            echo '::error::Synthetic receipt-test overlay authentication failed. See encrypted evidence.'
            exit 1
          fi
      - name: Fetch locked dependencies without lifecycle scripts
        shell: bash
        run: |
          set +x
          if ! bash scripts/prefetch.sh >>"$RUNNER_TEMP/dedup-private/run.log" 2>&1; then
            echo '::error::Dependency preparation failed. See encrypted evidence.'
            exit 1
          fi
      - name: Run offline macOS checks and probe native launch
        shell: bash
        run: |
          set +x
          if ! sandbox-exec -f "$RUNNER_TEMP/dedup-private/offline.sb" bash scripts/test-macos.sh >>"$RUNNER_TEMP/dedup-private/run.log" 2>&1; then
            echo '::error::macOS checks failed. See encrypted evidence.'
            exit 1
          fi
      - name: Encrypt evidence
        if: always()
        shell: bash
        env:
          MACOS_READINESS_KEY: ${{ secrets.MACOS_READINESS_KEY }}
        run: |
          set +x
          p="$RUNNER_TEMP/dedup-private"
          if [ ! -d "$p" ] || [ ! -f scripts/crypto.cjs ]; then
            echo '::warning::No evidence directory is available.'
            exit 0
          fi
          if ! tar -czf "$p/evidence.tar.gz" -C "$p" decrypt.log run.log evidence >/dev/null 2>&1; then
            echo '::error::Evidence archive creation failed.'
            exit 1
          fi
          if ! node scripts/crypto.cjs encrypt "$p/evidence.tar.gz" "$p/evidence.enc" evidence >/dev/null 2>&1; then
            echo '::error::Evidence encryption failed.'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: encrypted-macos-evidence
          path: ${{ runner.temp }}/dedup-private/evidence.enc
          if-no-files-found: ignore
          retention-days: 1
